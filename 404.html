<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=/">
  <title>Redirecting to Pure for Cure...</title>
  <link rel="icon" type="image/x-icon" href="images/logo/pure-for-cure-logo.png">
  <script>
    // Immediate redirect to homepage for any unknown or invalid URL
    (function() {
      try {
        var target = window.location.origin + '/';
        if (window.location.href !== target) {
          window.location.replace(target);
        }
      } catch (e) {
        window.location.href = '/';
      }
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .redirect-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
    }
    .logo-img {
      height: 48px;
      margin-bottom: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #1A8C4E;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.92rem;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .home-btn {
      display: inline-block;
      background: #1A8C4E;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 11px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .home-btn:hover {
      background: #15803D;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <img src="images/logo/pure-for-cure-logo.png" alt="Pure for Cure" class="logo-img" onerror="this.style.display='none';">
    <div class="spinner"></div>
    <h2>Redirecting to Home...</h2>
    <p>The requested page was not found. We are taking you back to Pure for Cure home page.</p>
    <a href="/" class="home-btn">Go to Home Now</a>
  </div>
</body>
</html>
